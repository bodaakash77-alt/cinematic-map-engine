<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cinematic Documentary — Remotion Preview</title>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "remotion": "https://esm.sh/remotion@4.0.494?deps=react@18.3.1",
      "@remotion/player": "https://esm.sh/@remotion/player@4.0.494?deps=react@18.3.1,react-dom@18.3.1,remotion@4.0.494"
    }
  }
  </script>
  <script type="module" src="https://esm.sh/tsx"></script>
  <style>
    html,body,#root{margin:0;min-height:100%;background:#07090c}
    body{font-family:Arial,sans-serif}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/tsx">
import React from "react";
import {createRoot} from "react-dom/client";
import {Player} from "@remotion/player";
import {CinematicDocumentary} from "https://esm.sh/gh/bodaakash77-alt/cinematic-map-engine@main/artifacts/remotion-studio/src/compositions/CinematicDocumentary.tsx?deps=react@18.3.1,remotion@4.0.494";

const App = () => (
  <div style={{minHeight:"100vh",background:"#07090c",padding:"24px",boxSizing:"border-box"}}>
    <div style={{maxWidth:1400,margin:"0 auto"}}>
      <div style={{color:"#d7b56d",fontSize:12,letterSpacing:4,fontWeight:700,marginBottom:10}}>
        REMOTION • CINEMATIC DOCUMENTARY
      </div>
      <div style={{color:"#e7e0d2",fontSize:28,fontWeight:700,marginBottom:18}}>
        Professional Motion Graphics Preview
      </div>
      <Player
        component={CinematicDocumentary}
        durationInFrames={450}
        fps={30}
        compositionWidth={1920}
        compositionHeight={1080}
        controls
        autoPlay
        loop
        style={{width:"100%",borderRadius:12,overflow:"hidden"}}
      />
      <div style={{color:"#7f8a91",fontSize:12,marginTop:12}}>
        1920×1080 • 30fps • 15 seconds • Live browser preview
      </div>
    </div>
  </div>
);

createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
