name: Deploy Remotion Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: artifacts/remotion-preview/package.json

      - name: Install preview dependencies
        working-directory: artifacts/remotion-preview
        run: npm install

      - name: Build preview
        working-directory: artifacts/remotion-preview
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/remotion-preview/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4